services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: chatgpt2api:local
    container_name: chatgpt2api-local
    ports:
      - "8000:80"
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json
    environment:
      # 存储后端配置 (可选值: json, sqlite, postgres, git)
       - STORAGE_BACKEND=json
      # 认证密钥 (可选，覆盖 config.json)
       - CHATGPT2API_AUTH_KEY=${CHATGPT2API_AUTH_KEY}
      # 基础 URL (可选)
       - CHATGPT2API_BASE_URL=${CHATGPT2API_BASE_URL}
    networks:
      - chatgpt2api
      - apinetwork

networks:
  chatgpt2api:
    name: chatgpt2api
  apinetwork:
    name: apinetwork
